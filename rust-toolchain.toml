[toolchain]
channel = "stable"          # Or "1.94.0" version

components = [
    "rustfmt",              # Standardized formatting
    "clippy",               # Professional linting
    "rust-src",             # Required for some cross-compilation/IDE support
    "rust-analyzer",        # Ensures IDE consistency
    "llvm-tools-preview"    # Provides LLVM tools for binary inspection and coverage
]

targets = ["wasm32-wasip2", "wasm32-unknown-unknown"]

profile = "default"