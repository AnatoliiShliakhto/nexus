[workspace]
resolver = "3"
members = ["clients/*", "components/*", "crates/*", "examples/*", "services/*", "tooling/*"]
exclude = []
default-members = []

[workspace.package]
version = "0.1.0"
authors = ["Anatolii Shliakhto <a.shlyakhto@gmail.com>"]
description = "Nexus: The Organizational Kernel"
keywords = ["management", "system", "spin", "wasi", "wasm"]
repository = "https://github.com/AnatoliiShliakhto/nexus"
readme = "README.md"
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.95.0"
publish = true

[workspace.dependencies]
android-native-keyring-store = "1.0.0"
apple-native-keyring-store = "1.0.0"
arc-swap = "1.9.1"
axum = "0.8.9"
axum-extra = "0.12.6"
axum-server = { version = "0.8.0", default-features = false }
base64 = "0.22.1"
bitflags = "2.11.1"
bytes = "1.11.1"
cargo_metadata = "0.23.1"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
config = "0.15.23"
confy = "2.0.0"
console-subscriber = "0.5.0"
criterion = "0.8.2"
crossbeam-epoch = "0.9.18"
dashmap = "7.0.0-rc2"
db-keystore = "0.4.2"
dbus-secret-service-keyring-store = "1.0.0"
dhat = "0.3.3"
dioxus = { version = "0.7.9" }
dioxus-sdk-time = "0.7.0"
dirs = "6.0.0"
dotenvy = "0.15.7"
ed25519-dalek = { version = "2.0.0-rc.3", default-features = false }
fluent = "0.17.0"
futures = "0.3.32"
futures-util = "0.3.32"
fxhash = "0.2.1"
getrandom =  { version = "0.4.2", default-features = false }
gloo-storage = "0.4.0"
heck = "0.5.0"
hex = "0.4.3"
http = "1.4.0"
http-body-util = "0.1.3"
hyper-util = "0.1.20"
jsonwebtoken = { version = "10.4.0", features = ["use_pem"] }
keyring-core = "1.0.0"
linux-keyutils-keyring-store = "1.0.0"
moka = "0.12.15"
nx-config = { version = "0.1.0", path = "crates/config", default-features = false }
nx-database = { version = "0.1.0", path = "crates/database", default-features = false }
nx-error = { version = "0.1.0", path = "crates/error", default-features = false }
nx-error-macros = { version = "0.1.0", path = "crates/error-macros", default-features = false }
nx-http = { version = "0.1.0", path = "crates/http", default-features = false }
nx-http-macros = { version = "0.1.0", path = "crates/http-macros", default-features = false }
nx-i18n = { version = "0.1.0", path = "crates/i18n", default-features = false }
nx-lockbox = { version = "0.1.0", path = "crates/lockbox", default-features = false }
nx-logger = { version = "0.1.0", path = "crates/logger", default-features = false }
nx-ui = { version = "0.1.0", path = "crates/ui", default-features = false }
nx-web-client = { version = "0.1.0", path = "crates/web-client", default-features = false }
opentelemetry = { version = "0.32.0", default-features = false }
opentelemetry-appender-tracing = { version = "0.32.0", default-features = false}
opentelemetry-http = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", default-features = false }
opentelemetry_sdk = { version = "0.32.0", default-features = false }
parking_lot = "0.12.5"
paste = "1.0.15"
postcard = { version = "1.1.3", features = ["alloc"] }
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0.106"
proptest = "1.11.0"
quote = "1.0.45"
radix_trie = "0.3.0"
redis = { version = "1.2.1", features = ["r2d2", "json", "bytes"] }
reqwest = "0.13.3"
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_repr = "0.1.20"
serial_test = "3.4.0"
sha2 = "0.11.0"
smallvec = "2.0.0-alpha.12"
smol_str = { version = "0.3.6", features = ["serde"] }
spin-sdk = { version = "6.0.0", default-features = false }
surrealdb = { version = "3.0.5", default-features = false, features = ["http"] }
surrealdb-types = "3.0.5"
syn = { version = "2.0.117", features = ["full", "parsing", "extra-traits"] }
sys-locale = "0.3.2"
tempfile = "3.27.0"
tinyvec = "1.11.0"
tokio = { version = "1.52.3", default-features = false }
toml_edit = { version = "0.25.11", features = ["serde"] }
tower = "0.5.3"
tower-http = { version = "0.6.11", features = ["trace"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-opentelemetry = { version = "0.33.0", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false }
unic-langid = "0.9.6"
url = "2.5.8"
utoipa = { version = "5.5.0", features = ["uuid", "chrono"] }
utoipa-scalar = { version = "0.3.0", features = ["axum"] }
uuid = { version = "1.23.1", default-features = false, features = ["v4"] }
vaultrs = { version = "0.8.0", default-features = false, features = ["rustls"] }
web-sys = "0.3.99"
windows-native-keyring-store = "1.1.0"
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"] } # Runtime for WIT components `cargo componens`;
zbus-secret-service-keyring-store = "1.0.0"

[profile.release]
codegen-units = 1
debug = false
lto = true
opt-level = "z"
panic = "abort"
split-debuginfo = "packed"
strip = "symbols"

[workspace.lints.rust]
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
missing_debug_implementations = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }
unreachable_pub = "warn"
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "warn"
unused_crate_dependencies = "warn"
unused_extern_crates = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
## lint groups
complexity = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "deny", priority = -1 }
restriction = { level = "allow", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

## allow the following lints
assigning_clones = "allow"
enum_variant_names = "allow"
len_without_is_empty = "allow"
literal_string_with_formatting_args = "allow"
new_ret_no_self = "allow"
redundant_pub_crate = "allow"
result_unit_err = "allow"
single_match = "allow"
too_long_first_doc_paragraph = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
unnecessary_map_or = "allow"
useless_asref = "allow"
vec_init_then_push = "allow"
wrong_self_convention = "allow"

## warn the following lints
cast_possible_truncation = "warn"
dbg_macro = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
rc_buffer = "warn"
str_to_string = "warn"
todo = "warn"
