# ./grafana/provisioning/datasources/ds.yaml
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
    correlations:
      - targetUID: jaeger
        label: 'Jaeger traces'
        description: 'Related traces stored in Jaeger'
    jsonData:
      manageAlerts: false
      derivedFields:
        - name: 'traceID'
          matcherRegex: '"trace_id":"([a-zA-Z0-9]+)"'
          url: '$${__value.raw}'
          datasourceUid: jaeger
          urlDisplayLabel: 'jaeger'
          internalLinkEnabled: true
          internalLinkTarget: 'blank'
          internalLinkTargetPage: 'blank'

  - name: Jaeger
    type: jaeger
    uid: jaeger
    url: http://jaeger:16686
    jsonData:
      httpMethod: GET
      nodeGraph:
        enabled: true
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-2m'
        spanEndTimeShift: '2m'
        filterByTraceID: true
        filterBySpanID: true
        customQuery: true
        query: '{job="spin"} | json | line_format `[{{.fields_code}}] {{.fields_message}} details={{.fields_details}} component={{.target}}`'

      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: '-2m'
        spanEndTimeShift: '2m'
        tags: [{ key: 'service', value: 'service.name' }]
        queries:
          - name: 'Resource Usage (CPU/Mem)'
            query: 'rate(spin_component_cpu_time_sum{component_id="$service"}[1m])'
          - name: 'Cold Start Impact'
            query: 'histogram_quantile(0.95, sum(rate(spin_component_memory_used_on_init_bucket{component_id="$service"}[5m])) by (le))'