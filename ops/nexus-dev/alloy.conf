otelcol.receiver.otlp "default" {
  grpc { endpoint = "0.0.0.0:4317" }
  http { endpoint = "0.0.0.0:4318" }
  output {
    metrics = [otelcol.processor.batch.metrics.input]
    logs    = [otelcol.processor.batch.logs.input]
    traces  = [otelcol.processor.batch.traces.input]
  }
}

otelcol.processor.batch "metrics" {
  output { metrics = [otelcol.exporter.prometheus.default.input] }
}
otelcol.processor.batch "logs" {
  output { logs = [otelcol.exporter.loki.default.input] }
}
otelcol.processor.batch "traces" {
  output { traces = [otelcol.exporter.otlp.jaeger.input] }
}

otelcol.exporter.prometheus "default" {
  forward_to = [prometheus.remote_write.local.receiver]
}

otelcol.exporter.loki "default" {
  forward_to = [loki.process.process_logs.receiver]
}

otelcol.exporter.otlp "jaeger" {
  client {
    endpoint = "jaeger:4317"
    tls { insecure = true }
  }
}

loki.process "process_logs" {
  forward_to = [loki.write.local.receiver]
}

prometheus.remote_write "local" {
  endpoint { url = "http://prometheus:9090/api/v1/write" }
}

loki.write "local" {
  endpoint { url = "http://loki:3100/loki/api/v1/push" }
}